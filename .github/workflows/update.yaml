name: Update

on:
  workflow_dispatch:
    inputs:
      name:
        description: the PyPI project to check again
        required: true
        type: string

# shared with Sync and Harvest: every step of all three writes index.csv
concurrency:
  group: harvest

permissions:
  contents: write

env:
  HARVESTER: git+https://github.com/east-van-ai/yavapy-harvester@v0.1.2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # the tip when the job starts, not the commit that triggered a queued run
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10.3.2
        # the pin lives here, so the cache refreshes when it moves
        with:
          cache-dependency-glob: .github/workflows/update.yaml
      # the same author as the hand-run harvest commits
      - name: Set the author
        run: |
          git config user.name "East Van AI"
          git config user.email "east-van-ai@proton.me"
      # the input comes through env, so the shell never parses it as code
      - name: Update
        env:
          NAME: ${{ inputs.name }}
        run: |
          title=$(uvx --from "$HARVESTER" yavapy-harvester update . "$NAME")
          git add index.csv projects.csv
          git diff --cached --quiet || git commit -m "$title"
      - name: Push
        if: ${{ !cancelled() }}
        run: |
          git restore .
          git pull --rebase origin main
          git push origin HEAD:main
