name: Harvest

on:
  # away from the top of the hour, when GitHub's queue is busiest
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

# a run that overlaps another would race it on projects.csv
concurrency:
  group: harvest

permissions:
  contents: write

env:
  HARVESTER: git+https://github.com/east-van-ai/yavapy-harvester@v0.1.0
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        # the pin lives here, so the cache refreshes when it moves
        with:
          cache-dependency-glob: .github/workflows/harvest.yaml
      # the same author as the hand-run harvest commits
      - name: Set the author
        run: |
          git config user.name "East Van AI"
          git config user.email "east-van-ai@proton.me"
      - name: Walkdown
        run: |
          title=$(uvx --from "$HARVESTER" yavapy-harvester walkdown . --limit 50)
          git add projects.csv
          git diff --cached --quiet || git commit -m "$title"
      - name: Catchup
        run: |
          title=$(uvx --from "$HARVESTER" yavapy-harvester catchup . --limit 50)
          git add projects.csv marks.json
          git diff --cached --quiet || git commit -m "$title"
      # pushes the walkdown commit even when catchup failed; a failed step's rows are dropped
      - name: Push
        if: ${{ !cancelled() }}
        run: |
          git restore .
          git pull --rebase origin main
          git push origin HEAD:main
