name: Harvest

on:
  # small batches, four an hour, clear of Sync at :27 and of the top of the hour
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# shared with Sync: every step of both writes index.csv
concurrency:
  group: harvest

permissions:
  contents: write

env:
  HARVESTER: git+https://github.com/east-van-ai/yavapy-harvester@v0.1.1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        # the pin lives here, so the cache refreshes when it moves
        with:
          cache-dependency-glob: .github/workflows/harvest.yaml
      # the same author as the hand-run harvest commits
      - name: Set the author
        run: |
          git config user.name "East Van AI"
          git config user.email "east-van-ai@proton.me"
      - name: Walkdown
        run: |
          title=$(uvx --from "$HARVESTER" yavapy-harvester walkdown . --limit 10)
          git add index.csv projects.csv
          git diff --cached --quiet || git commit -m "$title"
      - name: Catchup
        run: |
          title=$(uvx --from "$HARVESTER" yavapy-harvester catchup . --limit 20)
          git add index.csv projects.csv marks.json
          git diff --cached --quiet || git commit -m "$title"
      - name: Backfill
        run: |
          title=$(uvx --from "$HARVESTER" yavapy-harvester backfill . --limit 10)
          git add index.csv projects.csv
          git diff --cached --quiet || git commit -m "$title"
      # pushes the earlier steps' commits even when a later one failed; a failed step's rows are dropped
      - name: Push
        if: ${{ !cancelled() }}
        run: |
          git restore .
          git pull --rebase origin main
          git push origin HEAD:main
